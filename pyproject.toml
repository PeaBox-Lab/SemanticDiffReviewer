[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticdiff"
version = "3.0.0"
description = "Semantic change intelligence and governance for JSON, YAML, configuration, and OpenAPI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PeaBox Labs"}]
dependencies = ["PyYAML>=6.0,<7", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9,<1", "jsonschema>=4.23,<5"]
keywords = ["json", "yaml", "diff", "semantic-diff", "cli", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1", "mypy>=1.13,<2", "build>=1.2,<2"]

[project.scripts]
semanticdiff = "semanticdiff.cli:main"
semanticdiff-ui = "semanticdiff.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
semanticdiff = ["templates/*.html"]
