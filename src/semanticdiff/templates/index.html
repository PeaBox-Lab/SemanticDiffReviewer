<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SemanticDiff Studio</title><style>
:root{--bg:#07101f;--panel:#101b30;--line:#263754;--text:#eef4ff;--muted:#96a8c8;--brand:#7795ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#152d55,#07101f 55%);color:var(--text);font:14px system-ui}header,main{max-width:1500px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:28px}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#101b30ee;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 20px 60px #0005}textarea{width:100%;min-height:280px;background:#07101f;color:#eaf1ff;border:1px solid var(--line);border-radius:12px;padding:13px;font:13px ui-monospace,monospace}.small{min-height:120px}.bar,.stats,.filters{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}button,select,input{border:1px solid var(--line);border-radius:10px;padding:9px 13px;background:#1b2945;color:white}button{background:var(--brand);font-weight:700;cursor:pointer}.ghost{background:#1b2945}.pill{padding:8px 11px;border-radius:999px;background:#1b2945}.critical{color:#ff7b91}.high{color:#ffad67}.medium{color:#ffe07b}.low{color:#83e6b1}.row{display:grid;grid-template-columns:1.3fr .55fr .55fr 1fr;border-top:1px solid var(--line);padding:10px;gap:8px}.row:first-child{border:0}.head{font-weight:700;background:#17243d}.drop{border:1px dashed #6783bb;padding:10px;border-radius:10px;margin-bottom:10px;color:var(--muted)}pre{white-space:pre-wrap;margin:4px 0}.hidden{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.head{display:none}}
</style></head><body><header><div><h1>SemanticDiff Studio</h1><div class="muted">Explain configuration changes without exposing your data.</div></div><span class="pill">Local-first</span></header><main><div class="bar"><select id="preset"><option value="">Strict comparison</option><option>api</option><option>kubernetes</option><option>package</option><option>human-friendly</option></select><button onclick="compareDocs()">Compare</button><button class="ghost" onclick="swap()">Swap sides</button><button class="ghost" onclick="sample()">Load sample</button><button class="ghost" onclick="clearAll()">Clear</button></div><div class="grid"><section class="card"><h2>Before</h2><div class="drop">Drop JSON/YAML here or <input type="file" onchange="readFile(event,'left')"></div><textarea id="left"></textarea></section><section class="card"><h2>After</h2><div class="drop">Drop JSON/YAML here or <input type="file" onchange="readFile(event,'right')"></div><textarea id="right"></textarea></section></div><div class="grid" style="margin-top:14px"><section class="card"><details><summary>Advanced comparison rules</summary><textarea class="small" id="rules">ignore_paths: []
unordered_paths: []
keyed_arrays: {}
severity_paths:
  /security/*: critical
sensitive_paths:
  - "*/credentials/*"</textarea></details></section><section class="card"><details><summary>JSON Schema validation</summary><textarea class="small" id="schema"></textarea></details></section></div><div class="bar"><button class="ghost" onclick="download('json')">JSON report</button><button class="ghost" onclick="download('markdown')">Markdown</button><button class="ghost" onclick="download('html')">HTML</button><span class="muted">Secret-like values are automatically redacted in reports.</span></div><section class="card"><div id="stats" class="stats"></div><div class="filters"><input id="search" placeholder="Filter by path or explanation" oninput="renderRows()"><select id="severity" onchange="renderRows()"><option value="">All impacts</option><option>critical</option><option>high</option><option>medium</option><option>low</option></select></div><div id="validation"></div><div id="rows"></div></section></main><script>
let current=null; const $=s=>document.querySelector(s); const fields=()=>({left:$('#left').value,right:$('#right').value,rules:$('#rules').value,schema:$('#schema').value,preset:$('#preset').value});
async function compareDocs(){let f=new FormData();Object.entries(fields()).forEach(([k,v])=>f.append(k,v));let r=await fetch('/api/compare',{method:'POST',body:f});if(!r.ok){$('#rows').textContent=await r.text();return}current=await r.json();render()}
function render(){let s=current.summary;$('#stats').innerHTML=`<span class="pill">${current.equal?'✓ Equivalent':'≠ Different'}</span><span class="pill">Risk: ${current.risk||'info'}</span>`+Object.entries(s).map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join('');let v=current.validation;$('#validation').innerHTML=!v?'':v.valid?'<p class="low">✓ Both documents match the schema</p>':'<h3 class="high">Schema issues</h3>'+v.issues.map(x=>`<p>${esc(x.document)} <code>${esc(x.path)}</code>: ${esc(x.message)}</p>`).join('');renderRows()}
function renderRows(){if(!current)return;let q=$('#search').value.toLowerCase(),sev=$('#severity').value;let ds=current.differences.filter(d=>(!sev||d.severity===sev)&&(!q||(d.path+' '+d.explanation).toLowerCase().includes(q)));$('#rows').innerHTML='<div class="row head"><div>Path and explanation</div><div>Change</div><div>Impact</div><div>Values</div></div>'+ds.map(d=>`<div class="row"><div><code>${esc(d.path)}</code><div class="muted">${esc(d.explanation)}</div></div><div>${d.kind}</div><div class="${d.severity}">${d.severity}</div><div><pre>Before: ${esc(JSON.stringify(d.left))}</pre><pre>After: ${esc(JSON.stringify(d.right))}</pre></div></div>`).join('')}
function readFile(e,id){let f=e.target.files[0],r=new FileReader();r.onload=()=>{$('#'+id).value=r.result};r.readAsText(f)}
function swap(){let x=$('#left').value;$('#left').value=$('#right').value;$('#right').value=x}function clearAll(){$('#left').value=$('#right').value=$('#schema').value='';current=null;$('#rows').innerHTML=$('#stats').innerHTML=''}
function sample(){$('#left').value='service:\n  name: API\n  replicas: 2\n  token: old-secret\n  tags: [stable, public]';$('#right').value='service:\n  name: api\n  replicas: 4\n  token: new-secret\n  tags: [public, stable]';$('#preset').value='human-friendly';compareDocs()}
async function download(fmt){let f=new FormData();Object.entries(fields()).forEach(([k,v])=>f.append(k,v));let r=await fetch('/export/'+fmt,{method:'POST',body:f}),b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='semanticdiff.'+(fmt==='markdown'?'md':fmt);a.click()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}sample();
</script></body></html>
